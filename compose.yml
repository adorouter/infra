# adorouter on one server. Nothing is published to the internet directly: the only
# way in is the Cloudflare Tunnel, and images are pinned by commit in .env.
name: adorouter

services:
  gateway:
    image: ghcr.io/adorouter/new-api:${GATEWAY_COMMIT:?set GATEWAY_COMMIT in .env}
    restart: unless-stopped
    env_file: gateway.env
    environment:
      SQL_DSN: postgres://adorouter:${POSTGRES_PASSWORD:?}@postgres:5432/adorouter?sslmode=disable
      REDIS_CONN_STRING: redis://:${REDIS_PASSWORD:?}@redis:6379/0
      # Only the tunnel can reach this service, so it's the only proxy to believe.
      TRUSTED_PROXIES: 172.30.0.0/24
      ADO_SITE_URL: https://adorouter.com
      TZ: UTC
    volumes:
      - gateway-data:/data
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:3000/api/status"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 60s
    networks: [internal]

  site:
    image: ghcr.io/adorouter/adorouter:${SITE_COMMIT:?set SITE_COMMIT in .env}
    restart: unless-stopped
    env_file: site.env
    environment:
      INTERNAL_API_URL: http://gateway:3000
    depends_on:
      gateway: { condition: service_healthy }
    networks: [internal]

  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: adorouter
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?}
      POSTGRES_DB: adorouter
      POSTGRES_INITDB_ARGS: --encoding=UTF8 --locale=C
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U adorouter -d adorouter"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks: [internal]

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD:?}", "--appendonly", "yes"]
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$$REDIS_PASSWORD\" --no-auth-warning ping | grep -q PONG"]
      interval: 10s
      timeout: 5s
      retries: 10
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?}
    networks: [internal]

  cloudflared:
    image: cloudflare/cloudflared:2025.10.0
    restart: unless-stopped
    command: ["tunnel", "--no-autoupdate", "run"]
    environment:
      TUNNEL_TOKEN: ${TUNNEL_TOKEN:?}
    depends_on:
      gateway: { condition: service_healthy }
    networks: [internal]

volumes:
  gateway-data:
  postgres-data:
  redis-data:

networks:
  internal:
    ipam:
      config:
        - subnet: 172.30.0.0/24
