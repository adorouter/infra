# AdoRouter's production sync config, mounted into the sync container by
# compose.yml. Secrets, upstream addresses and upstream names come from sync.env
# on the server, never from this file: which upstreams serve us stays private.
#
# Prices: model prices are official list prices. Marketplace lanes are 2x the
# merchant's price (docs/gateway-settings.md, Pricing).

target:
  # The gateway over the sync network. It accepts the sync token from there only.
  baseUrl: ${ADOROUTER_SYNC_TARGET:-http://gateway:3000}
  systemAccessToken: ${ADOROUTER_SYNC_TOKEN}
  userId: 1

# Text models only: image and video need Creem's moderation and a privacy
# change first.
testModelTypes: ["text"]

# Never publish a lane that costs as much as the official price or more.
skipUnprofitableText: true

# Authenticity checks that only log, per model maker. Claude lanes are not
# rejected for refusing the Tiananmen question (censored-history, decided
# 2026-11-08): the finding is still written to the observe log. The question is
# still asked, because fake-200 reads the same answer to catch platform content
# filters on every maker. Naming a maker here replaces its defaults, and
# anthropic's default is to enforce every rule, so only this one is relaxed.
authenticity:
  observeOnly:
    anthropic: ["censored-history"]

# Models and merchants dropped before anything else.
blacklist:
  - nsfw
  # Not chat models, and their marketplace lanes sat at or above list price.
  - "*embedding*"
  - codex-auto-review
  # No Kiro merchants, for any model.
  - m1/*kiro*

providers:
  # m1: a marketplace of many merchants (address in sync.env). One lane per
  # merchant per model, named m1-<listing>-<model>.
  - type: a7
    name: m1
    baseUrl: ${M1_BASE_URL}
    systemAccessToken: ${M1_ACCESS_TOKEN}
    userId: ${M1_USER_ID}
    # Merchants with and without an authenticity deposit (decided 2026-11-08).
    # Only about 1 listing in 20 carries one, and every lane passes the same
    # authenticity checks before it is served, which caught fakers among
    # deposit holders too. Set guaranteedOnly: true to go back to deposit
    # holders only.
    guaranteedOnly: false
    # Retail = merchant price x 2. A lane is only published when that comes to
    # 80% of the official list price or less, so every lane is at least 20% off.
    profitMultiple: 2
    maxSellFraction: 0.8
    # Up to three merchants per model, cheapest first, so one failing merchant
    # does not take the model down.
    hostsPerModel:
      default: 3
    # Data policy for the site's labels and consent dialog. No company, country
    # or privacy policy is published, so it is treated as a provider outside the
    # EU without safeguards that may keep or train on prompts: EU users are asked
    # for consent first. providerName is internal and never shown publicly.
    providerName: ${M1_PROVIDER_NAME:-m1}
    seatCountry: CN
    prompts: unknown
    transfer: none
    perUpstreamConcurrency: 2
    # After the walk, every kept lane is asked three times for about 300
    # integers and ranked against lm-detector's bank of official routes
    # (decided 2026-11-09). Observe only: results are logged to
    # logs/number-fingerprint-<date>.jsonl and reject nothing. Each lane is
    # measured again after a week; the pass stops after 30 minutes and the
    # rest wait for the next run.
    numberFingerprint:
      budgetMinutes: 30
      retestDays: 7
      lanesInParallel: 2
